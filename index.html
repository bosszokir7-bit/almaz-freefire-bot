<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Магазин Алмаз - Авто ID</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      margin: 0;
      padding: 20px;
      color: #fff;
    }
    .container {
      max-width: 500px;
      margin: auto;
      background: rgba(0,0,0,0.6);
      padding: 25px;
      border-radius: 15px;
    }
    h1 { text-align: center; color: #FFD700; }
    label { display: block; margin-top: 15px; font-weight: bold; }
    input, select, button {
      width: 100%; padding: 12px; margin-top: 8px; border: none;
      border-radius: 8px; font-size: 16px; box-sizing: border-box;
    }
    input, select { background: #fff; color: #333; }
    button {
      background: #FF4500; color: white; font-weight: bold; cursor: pointer;
      margin-top: 20px; transition: 0.3s;
    }
    button:hover { background: #ff6500; }
    .card { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; margin-top: 10px; }
    #playerName {
      color: #00FF00; font-weight: bold; margin-top: 5px; display: none;
    }
    .admin { text-align: center; margin-top: 25px; font-size: 14px; }
    .admin a { color: #25D366; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <h1>💎 МАГАЗИН АЛМАЗ 💎</h1>
    
    <div class="card">
      <label for="appkey">APP KEY / ID игрока Free Fire</label>
      <input type="text" id="appkey" placeholder="ID - ро инҷо нависед" onkeyup="getPlayerName()">
      <div id="playerName"></div>
      
      <label for="server">Серверро интихоб кн</label>
      <select id="server">
        <option value="RU">RU - Россия</option>
        <option value="IND">IND - Индия</option>
        <option value="ME">ME - Шарқи Наздик</option>
      </select>
    </div>

    <div class="card">
      <label>Тугмаи харидани Алмаз</label>
      <select id="diamond">
        <option value="100">100 Алмаз - 1 USDT</option>
        <option value="310">310 Алмаз - 3 USDT</option>
        <option value="520">520 Алмаз - 5 USDT</option>
        <option value="1060">1060 Алмаз - 10 USDT</option>
      </select>
    </div>

    <button onclick="buyDiamond()">ХАРИДАН 💎</button>

    <div class="admin">
      <p>Проблема доштӣ? Ба Админ навиш:</p>
      <a href="https://wa.me/992935710406" target="_blank">📱 +992 93 571 04 06</a>
    </div>
  </div>

  <script>
    // ВАҚТЕ ID НАВИШТА МЕШАВАД, НОМ АВТОМАТ МЕОЯД
    function getPlayerName() {
      let id = document.getElementById('appkey').value;
      let nameDiv = document.getElementById('playerName');
      
      if(id.length >= 6){ // Агар ID 6 рақам зиёд бошад
        // ИН ҶО API МЕЗАНАД. ҲОЗИР ФАҚАТ МИСОЛ АСТ
        // Ту бояд API - и FazerCards - ро ин ҷо гузорӣ
        
        // МИСОЛ:
        nameDiv.style.display = 'block';
        nameDiv.innerHTML = '✅ Ном ёфт шуд: ProGamer_TJ'; 
        
        // АГАР API МЕДОШТӢ:
        // fetch('https://api.fazercards.com/getname?id='+id+'&server='+server)
        // .then(res => res.json())
        // .then(data => {
        //   nameDiv.style.display = 'block';
        //   nameDiv.innerHTML = '✅ Ном: ' + data.nickname;
        // })
      } else {
        nameDiv.style.display = 'none';
      }
    }

    function buyDiamond() {
      let id = document.getElementById('appkey').value;
      let server = document.getElementById('server').value;
      let diamond = document.getElementById('diamond').value;

      if(id === "") {
        alert("Аввал ID - и худро дуруст ворид кн!");
        return;
      }
      alert("Тасдиқ мекунӣ?\nID: " + id + "\nНом: ProGamer_TJ\nСервер: " + server + "\nАлмаз: " + diamond);
    }
  </script>

</body>
</html>
