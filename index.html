<script>
const APP_KEY = "fc_21f5712e9156572137bdf68d"; // Калиди ту
let selected = {};

async function getNick(){
  let id = document.getElementById('ffid').value;
  if(id.length < 8) return;
  document.getElementById('nick').innerText = "Месанҷам...";
  document.getElementById('nick').style.color = "#00aaff";
  
  try {
    // API - и Fazercards
    let res = await fetch(`https://api.fazercards.com/v1/check?appkey=${APP_KEY}&game=freefire&uid=${id}`);
    let data = await res.json();
    
    if(data.status == "success"){
      document.getElementById('nick').innerText = data.data.nickname;
      document.getElementById('nick').style.color = "#00ff88";
    } else {
      document.getElementById('nick').innerText = "ID нодуруст";
      document.getElementById('nick').style.color = "red";
    }
  } catch(e){
    document.getElementById('nick').innerText = "Хатогӣ дар пайваст";
    document.getElementById('nick').style.color = "red";
  }
}

function select(diamond, usd){
  selected = {diamond, usd};
  document.getElementById('payment').style.display='block';
  document.getElementById('sum').innerText = `Шумо интихоб кардед: ${diamond} 💎 = ${usd} USDT`;
  window.scrollTo(0, document.body.scrollHeight);
}

async function order(){
  let id = document.getElementById('ffid').value;
  let txid = document.getElementById('txid').value;
  let nick = document.getElementById('nick').innerText;
  if(!id || nick == "Месанҷам..." || nick == "ID нодуруст"){ alert('Аввал ID - и дурустро нависта парто'); return; }
  if(!txid){ alert('TXID - ро нависта парто'); return; }
  
  // Ба API заказ медиҳем
  let res = await fetch(`https://api.fazercards.com/v1/order?appkey=${APP_KEY}&game=freefire&uid=${id}&product=${selected.diamond}`);
  let data = await res.json();
  
  if(data.status == "success"){
    alert(`✅ Заказ қабул шуд!\nНик: ${nick}\n${selected.diamond} 💎\n5-10 дақ дигар меояд`);
  } else {
    alert("❌ Хатогӣ: " + data.message);
  }
}
</script>
