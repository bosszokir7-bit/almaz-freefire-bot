<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TAJ.DONAT.TJ 💎</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{background:#0A0A0A;color:#fff;padding:16px;padding-bottom:85px}
.header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.avatar{width:48px;height:48px;background:linear-gradient(135deg,#FF8C00,#FF6A00);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#000;font-size:17px}
.greet{background:#1A1A1A;padding:5px 12px;border-radius:20px;font-size:12px;display:inline-block;color:#FF8C00;font-weight:600}
.name{font-weight:800;font-size:19px;margin-top:3px}
.bell{margin-left:auto;font-size:22px}
.balance-box{background:linear-gradient(180deg,#1A1A1A 0%,#141414 100%);padding:22px;border-radius:18px;margin-bottom:16px;border:1px solid #222}
.balance-title{color:#888;font-size:13px;font-weight:600}
.balance-amount{font-size:34px;font-weight:800;margin:10px 0;letter-spacing:-1px}
.balance-amount span{font-size:17px;color:#888;font-weight:600}
.btn-row{display:flex;gap:10px}
.btn-orange{flex:1;background:linear-gradient(135deg,#FF8C00,#FF6A00);color:#000;border:none;padding:15px;border-radius:14px;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 4px 15px rgba(255,140,0,0.3)}
.btn-outline{flex:1;background:transparent;color:#FF8C00;border:2px solid #FF8C00;padding:15px;border-radius:14px;font-weight:800;font-size:15px;cursor:pointer}
.tags{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
.tags span{background:#1A1A1A;padding:9px 13px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid #222}
.category-title{color:#888;font-size:13px;margin-bottom:16px;font-weight:700;letter-spacing:1px}
.card{border-radius:22px;padding:22px;height:170px;margin-bottom:16px;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 8px 25px rgba(0,0,0,0.4)}
.card-purple{background:linear-gradient(135deg,#8B5CF6 0%,#7C3AED 50%,#4C1D95 100%)}
.card-orange{background:linear-gradient(135deg,#F97316 0%,#EA580C 50%,#C2410C 100%)}
.card-subtitle{font-size:11px;opacity:0.9;font-weight:800;letter-spacing:1px}
.card-title{font-size:30px;font-weight:900;margin:6px 0 16px;letter-spacing:-1px}
.btn-buy{background:rgba(0,0,0,0.35);backdrop-filter:blur(10px);border:1.5px solid rgba(255,255,255,0.25);color:#fff;padding:11px 20px;border-radius:12px;font-weight:800;font-size:14px;cursor:pointer}
.bottom-menu{position:fixed;bottom:0;left:0;right:0;background:#1A1A1A;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #2A2A2A}
.menu-item{text-align:center;font-size:11px;color:#666;font-weight:600;cursor:pointer}
.menu-item.active{color:#FF8C00}
.toast{position:fixed;top:25px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#FF8C00,#FF6A00);color:#000;padding:12px 22px;border-radius:14px;font-weight:800;display:none;z-index:999;box-shadow:0 8px 25px rgba(255,140,0,0.4)}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div class="header">
<div class="avatar" id="avatar">Z</div>
<div><div class="greet">Шом ба хайр!</div><div class="name" id="username">Муштарӣ</div></div>
<div class="bell">🔔</div>
</div>

<div class="balance-box">
<div class="balance-title">БАЛАНС 👁</div>
<div class="balance-amount">0.00 <span>см</span></div>
<div class="btn-row">
<button class="btn-orange" onclick="topup()">+ Пур кардан</button>
<button class="btn-outline" onclick="withdraw()">↗ Бароврдан</button>
</div>
</div>

<div class="tags"><span>⚡ То 1 дакика</span><span>🛡️ Бехатар</span><span>🕒 24/7</span></div>
<div class="category-title">КАТЕГОРИЯХО</div>

<div class="card card-purple" onclick="buy('ffcis')">
<div class="card-subtitle">FREE FIRE</div><div class="card-title">СНГ</div><button class="btn-buy">Харидан →</button>
</div>

<div class="card card-orange" onclick="buy('ffid')">
<div class="card-subtitle">FREE FIRE</div><div class="card-title">ИНДОНЕЗИЯ</div><button class="btn-buy">Харидан →</button>
</div>

<div class="bottom-menu">
<div class="menu-item active">🏠<br>Асосӣ</div>
<div class="menu-item" onclick="send('orders')">🛍️<br>Харидҳо</div>
<div class="menu-item" onclick="send('support')">🎧<br>Дастгирӣ</div>
<div class="menu-item" onclick="send('profile')">👤<br>Профил</div>
</div>

<script>
let tg=window.Telegram.WebApp;tg.expand();tg.setBackgroundColor("#0A0A0A");
let user=tg.initDataUnsafe.user;if(user){document.getElementById('username').innerText=user.first_name;document.getElementById('avatar').innerText=user.first_name[0]}
function showToast(text){let t=document.getElementById('toast');t.innerText=text;t.style.display='block';setTimeout(()=>{t.style.display='none'},1800)}
function send(a){tg.sendData(JSON.stringify({action:a}));showToast('✅ Фиристода шуд')}
function topup(){send('topup')}function withdraw(){send('withdraw')}function buy(g){send('buy_'+g)}
</script>
</body>
</html>
