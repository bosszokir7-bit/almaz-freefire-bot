<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAJ.DONAT.TJ</title>
<style>
* {margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif;}
body {background:#0A0A0A; color:#fff; padding:15px; padding-bottom:80px;}
.header {display:flex; align-items:center; gap:12px; margin-bottom:15px;}
.avatar {width:45px; height:45px; background:#FF8C00; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:bold; color:#000; font-size:16px;}
.greet {background:#1A1A1A; padding:4px 10px; border-radius:20px; font-size:12px; display:inline-block;}
.name {font-weight:bold; font-size:18px;}
.bell {margin-left:auto; font-size:20px;}
.balance-box {background:#1A1A1A; padding:20px; border-radius:16px; margin-bottom:15px;}
.balance-title {color:#888; font-size:13px;}
.balance-amount {font-size:32px; font-weight:bold; margin:8px 0;}
.balance-amount span {font-size:16px; color:#888;}
.btn-row {display:flex; gap:10px;}
.btn-orange {flex:1; background:#FF8C00; color:#000; border:none; padding:14px; border-radius:12px; font-weight:bold; font-size:15px;}
.btn-outline {flex:1; background:transparent; color:#FF8C00; border:2px solid #FF8C00; padding:14px; border-radius:12px; font-weight:bold; font-size:15px;}
.tags {display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap;}
.tags span {background:#1A1A1A; padding:8px 12px; border-radius:20px; font-size:12px;}
.category-title {color:#888; font-size:13px; margin-bottom:15px;}
.card {border-radius:20px; padding:20px; position:relative; overflow:hidden; height:160px; margin-bottom:15px;}
.card-purple {background:linear-gradient(135deg, #8B5CF6 0%, #4C1D95 100%);}
.card-orange {background:linear-gradient(135deg, #F97316 0%, #EA580C 100%);}
.card-content {position:relative; z-index:2;}
.card-subtitle {font-size:12px; opacity:0.8; font-weight:bold;}
.card-title {font-size:28px; font-weight:bold; margin:5px 0 15px;}
.btn-buy {background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.4); color:#fff; padding:10px 18px; border-radius:10px; font-weight:bold;}
.bottom-menu {position:fixed; bottom:0; left:0; right:0; background:#1A1A1A; display:flex; justify-content:space-around; padding:12px 0; border-top:1px solid #333;}
.menu-item {text-align:center; font-size:11px; color:#888;}
.menu-item.active {color:#FF8C00;}
</style>
</head>
<body>

<div class="header">
  <div class="avatar">ZO</div>
  <div>
    <div class="greet">Шом ба хайр!</div>
    <div class="name">zokirjon</div>
  </div>
  <div class="bell">🔔</div>
</div>

<div class="balance-box">
  <div class="balance-title">БАЛАНС 👁</div>
  <div class="balance-amount">0.00 <span>см</span></div>
  <div class="btn-row">
    <button class="btn-orange">+ Пур кардан</button>
    <button class="btn-outline">↗ Бароврдан</button>
  </div>
</div>

<div class="tags">
  <span>⚡ То 1 дакика</span>
  <span>🛡️ Бехатар</span>
  <span>🕒 24/7</span>
</div>

<div class="category-title">КАТЕГОРИЯХО</div>

<div class="card card-purple">
  <div class="card-content">
    <div class="card-subtitle">FREE FIRE</div>
    <div class="card-title">СНГ</div>
    <button class="btn-buy">Харидан →</button>
  </div>
</div>

<div class="card card-orange">
  <div class="card-content">
    <div class="card-subtitle">FREE FIRE</div>
    <div class="card-title">ИНДОНЕЗИЯ</div>
    <button class="btn-buy">Харидан →</button>
  </div>
</div>

<div class="bottom-menu">
  <div class="menu-item active">🏠<br>Асосӣ</div>
  <div class="menu-item">🛍️<br>Харидҳо</div>
  <div class="menu-item">🎧<br>Дастгирӣ</div>
  <div class="menu-item">👤<br>Профил</div>
</div>

</body>
</html>
