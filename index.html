<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAJ.DONAT.TJ - Магоза</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { background: #0a0a0a; color: white; font-family: sans-serif; padding: 15px; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { color: #ff9500; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .card { background: #1a1a1a; border-radius: 12px; padding: 10px; text-align: center; border: 1px solid #333; }
    .card img { width: 50px; height: 50px; }
    .card h3 { font-size: 14px; margin: 5px 0; }
    .card p { color: #ff9500; font-weight: bold; font-size: 16px; }
    .btn { background: #ff9500; color: black; border: none; padding: 10px; width: 100%; border-radius: 8px; font-weight: bold; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>💎 FREE FIRE СНГ</h1>
    <p>UID-и худро ворид кунед</p>
    <input type="text" placeholder="UID" style="width: 90%; padding: 10px; border-radius: 8px; border: none; background: #222; color: white;">
  </div>

  <div class="grid">
    <div class="card">
      <img src="https://cdn-icons-png.flaticon.com/512/2179/2179799.png">
      <h3>110 Алмазхо</h3>
      <p>8.50 см</p>
    </div>
    <div class="card">
      <img src="https://cdn-icons-png.flaticon.com/512/2179/2179799.png">
      <h3>341 Алмазхо</h3>
      <p>26.50 см</p>
    </div>
    <div class="card">
      <img src="https://cdn-icons-png.flaticon.com/512/2179/2179799.png">
      <h3>572 Алмазхо</h3>
      <p>45.90 см</p>
    </div>
    <div class="card">
      <img src="https://cdn-icons-png.flaticon.com/512/2179/2179799.png">
      <h3>1166 Алмазхо</h3>
      <p>88.00 см</p>
    </div>
    <div class="card">
      <img src="https://cdn-icons-png.flaticon.com/512/2179/2179799.png">
      <h3>2398 Алмазхо</h3>
      <p>178.00 см</p>
    </div>
    <div class="card">
      <img src="https://cdn-icons-png.flaticon.com/512/2179/2179799.png">
      <h3>6160 Алмазхо</h3>
      <p>450.00 см</p>
    </div>
  </div>

  <button class="btn" onclick="tg.sendData('order')">Харидан</button>

  <script>
    let tg = window.Telegram.WebApp;
    tg.expand();
  </script>
</body>
</html>
